<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Вход в систему Space | Машенька</title>
    <style>
        :root {
            --bg-body: #181818;
            --bg-card: #222225;
            --border-color: #333338;
            --text-main: #cccccc;
            --text-bright: #ffffff;
            --text-muted: #858585;
            --accent-blue: #007acc;
            --accent-pink: #d16d9e;
            --error-red: #f48771;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe WPC", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 20px;
        }

        .auth-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 32px 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar-wrap {
            position: relative;
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-blue));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 4px 14px rgba(209, 109, 158, 0.4);
        }

        .shield-icon {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: #1e1e1e;
            border-radius: 50%;
            padding: 3px;
            font-size: 16px;
        }

        h1 {
            font-size: 20px;
            color: var(--text-bright);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 26px;
        }

        .pin-inputs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .pin-digit {
            width: 52px;
            height: 60px;
            background-color: #2d2d30;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 26px;
            text-align: center;
            color: var(--text-bright);
            outline: none;
            transition: all 0.2s ease;
        }

        .pin-digit:focus {
            border-color: var(--accent-blue);
            background-color: #37373d;
            box-shadow: 0 0 0 2px rgba(0, 122, 204, 0.3);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #007acc, #005a9e);
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:hover {
            opacity: 0.95;
        }

        .error-msg {
            color: var(--error-red);
            font-size: 13px;
            margin-top: 16px;
            min-height: 18px;
            display: none;
        }

        .shake {
            animation: shake 0.35s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .footer-note {
            margin-top: 24px;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="auth-card" id="authCard">
        <div class="avatar-wrap">
            <div class="avatar">М</div>
            <div class="shield-icon">🛡️</div>
        </div>
        <h1>Машенька | Space</h1>
        <p class="subtitle">Введи 4-значный PIN-код доступа</p>

        <div class="pin-inputs" id="pinBox">
            <input type="password" inputmode="numeric" maxlength="1" class="pin-digit" autofocus>
            <input type="password" inputmode="numeric" maxlength="1" class="pin-digit">
            <input type="password" inputmode="numeric" maxlength="1" class="pin-digit">
            <input type="password" inputmode="numeric" maxlength="1" class="pin-digit">
        </div>

        <button class="btn-submit" id="btnSubmit">Войти в систему</button>
        <div class="error-msg" id="errorMsg"></div>

        <div class="footer-note">
            Защищено Space Shield • Доступ только для Олежки
        </div>
    </div>

    <script>
        const digits = Array.from(document.querySelectorAll('.pin-digit'));
        const btnSubmit = document.getElementById('btnSubmit');
        const errorMsg = document.getElementById('errorMsg');
        const authCard = document.getElementById('authCard');

        const SECRET_HASH = "71c056a29a4be95c528336527b9ab5872c3ba14ebcd6a5b007dc48e0cbade72d";

        // Обработка фокуса и ввода цифр
        digits.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (input.value.length === 1) {
                    if (index < digits.length - 1) {
                        digits[index + 1].focus();
                    } else {
                        verifyPin();
                    }
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    digits[index - 1].focus();
                } else if (e.key === 'Enter') {
                    verifyPin();
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = (e.clipboardData || window.clipboardData).getData('text').trim();
                if (/^\d{4}$/.test(pasteData)) {
                    pasteData.split('').forEach((char, i) => {
                        digits[i].value = char;
                    });
                    verifyPin();
                }
            });
        });

        btnSubmit.addEventListener('click', verifyPin);

        async function verifyPin() {
            const enteredPin = digits.map(d => d.value).join('');
            if (enteredPin.length < 4) {
                showError('Введи все 4 цифры PIN-кода!');
                return;
            }

            // Хешируем введенный PIN в SHA-256
            const msgBuffer = new TextEncoder().encode(enteredPin + "_space_secret_salt_2026");
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            if (hashHex === SECRET_HASH) {
                // Ставим куку на 30 дней
                const expires = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toUTCString();
                document.cookie = `masha_auth=${SECRET_HASH}; expires=${expires}; path=/; SameSite=Lax; Secure`;

                errorMsg.style.display = 'block';
                errorMsg.style.color = '#4ec9b0';
                errorMsg.textContent = 'Доступ разрешён! Входим... ✨';

                setTimeout(() => {
                    // Возвращаемся в корень
                    window.location.href = '/';
                }, 400);
            } else {
                showError('Доступ запрещён! Неверный PIN 🚫');
                digits.forEach(d => d.value = '');
                digits[0].focus();
            }
        }

        function showError(text) {
            errorMsg.style.display = 'block';
            errorMsg.style.color = 'var(--error-red)';
            errorMsg.textContent = text;
            authCard.classList.remove('shake');
            void authCard.offsetWidth; // перезапуск анимации
            authCard.classList.add('shake');
        }
    </script>
</body>
</html>
