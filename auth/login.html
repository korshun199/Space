<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Машенька Space — Авторизация</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background-color: #2b2b3b;
            border: 1px solid #45475a;
            border-radius: 16px;
            padding: 35px 30px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #f5c2e7, #cba6f7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 32px;
            box-shadow: 0 4px 15px rgba(203, 166, 247, 0.4);
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #f5e0dc;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: #a6adc8;
            margin-bottom: 25px;
        }
        .pin-inputs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }
        .pin-digit {
            width: 50px;
            height: 55px;
            background-color: #181825;
            border: 2px solid #45475a;
            border-radius: 10px;
            color: #f5e0dc;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            outline: none;
            transition: all 0.2s;
        }
        .pin-digit:focus {
            border-color: #cba6f7;
            box-shadow: 0 0 8px rgba(203, 166, 247, 0.5);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #cba6f7, #b4befe);
            border: none;
            border-radius: 10px;
            color: #11111b;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-login:hover {
            opacity: 0.9;
        }
        .error-msg {
            color: #f38ba8;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="avatar">🌸</div>
        <h1>Машенька Space</h1>
        <p>Введите PIN-код для входа</p>
        
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="pin-inputs">
                <input type="password" maxlength="1" class="pin-digit" pattern="[0-9]*" inputmode="numeric" autofocus>
                <input type="password" maxlength="1" class="pin-digit" pattern="[0-9]*" inputmode="numeric">
                <input type="password" maxlength="1" class="pin-digit" pattern="[0-9]*" inputmode="numeric">
                <input type="password" maxlength="1" class="pin-digit" pattern="[0-9]*" inputmode="numeric">
            </div>
            <button type="submit" class="btn-login">Войти</button>
            <div id="errorMsg" class="error-msg">Неверный PIN-код</div>
        </form>
    </div>

    <script>
        const inputs = document.querySelectorAll('.pin-digit');
        const errorMsg = document.getElementById('errorMsg');

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        async function handleLogin(e) {
            e.preventDefault();
            const pin = Array.from(inputs).map(i => i.value).join('');
            if (pin.length !== 4) return false;

            // Считаем SHA-256 хэш от pin + salt
            const salt = "_space_secret_salt_2026";
            const encoder = new TextEncoder();
            const data = encoder.encode(pin + salt);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            // Хэш для PIN 0711
            const expectedHash = "71c056a29a4be95c528336527b9ab5872c3ba14ebcd6a5b007dc48e0cbade72d";

            if (hashHex === expectedHash) {
                // Ставим куку на 30 дней
                const expires = new Date(Date.now() + 30 * 86400 * 1000).toUTCString();
                document.cookie = `masha_auth=${hashHex}; path=/; expires=${expires}; Secure; SameSite=Lax`;
                window.location.href = "/";
            } else {
                errorMsg.style.display = 'block';
                inputs.forEach(i => i.value = '');
                inputs[0].focus();
            }
            return false;
        }
    </script>
</body>
</html>
